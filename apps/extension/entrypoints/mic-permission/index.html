<!doctype html>
<html lang="ar" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>دليلي — إذن الميكروفون</title>
    <style>
      /* نفس رموز التصميم: خلفية داكنة ونص فاتح وبرتقالي دليلي */
      body {
        margin: 0; min-height: 100vh; display: grid; place-items: center;
        background: #0F1A18; color: #EAF4F1;
        font-family: 'IBM Plex Sans Arabic', 'Segoe UI', Tahoma, sans-serif;
      }
      .card {
        max-width: 420px; padding: 32px 28px; text-align: center;
        display: flex; flex-direction: column; gap: 14px; align-items: center;
      }
      .mic { font-size: 44px; line-height: 1; }
      h1 { font-size: 20px; margin: 0; }
      p { font-size: 14px; line-height: 1.8; color: #B9CDC8; margin: 0; }
      .state { font-size: 15px; font-weight: 700; }
      .ok { color: #3BBD6A; }
      .no { color: #FDBA74; }
    </style>
  </head>
  <body>
    <div class="card">
      <div class="mic" aria-hidden="true">🎙️</div>
      <h1>تشغيل التعليق الصوتي</h1>
      <p>سيطلب المتصفح إذن الميكروفون مرة واحدة. صوتك يُسجَّل أثناء الالتقاط فقط، ويُرفع مع الدليل حين تنهيه.</p>
      <p class="state" id="state">بانتظار إذنك…</p>
    </div>
    <script type="module" src="./main.ts"></script>
  </body>
</html>
