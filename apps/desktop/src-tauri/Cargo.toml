[package]
name = "app"
version = "0.1.0"
description = "A Tauri App"
authors = ["you"]
license = ""
repository = ""
edition = "2021"
rust-version = "1.77.2"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
name = "app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.6.3", features = [] }

# ميزة الاختبار فقط للأقبية: ‏tauri::test ‏(MockRuntime) لاختبار التكامل الحيّ —
# لا تدخل بناء الإنتاج (dev-dependencies لا تُوحَّد ميزاتها في بناء الإطلاق)
[dev-dependencies]
tauri = { version = "2.11.3", features = ["test"] }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
log = "0.4"
tauri = { version = "2.11.3", features = [] }
tauri-plugin-log = "2"
jpeg-encoder = "0.6"
zune-jpeg = "0.4"
zune-core = "0.4"
# إذن الميكروفون للودجة (المرحلة ٢): معالج PermissionRequested على WebView2 —
# نفس نسخة القفل التي يجلبها wry فلا حزمة جديدة تُجمَّع
webview2-com = "0.38.2"
# النقل (٣د): ‏multipart للّقطات وrustls للـTLS — بلا كوكي ولا openssl، وblocking
# لخيط الاستطلاع الخلفيّ (انضباط خيوط ٣ب نفسه)
reqwest = { version = "0.12", default-features = false, features = ["multipart", "rustls-tls", "blocking"] }
windows-core = "0.61"
windows = { version = "0.61", features = [
  "Foundation",
  "Graphics",
  "Graphics_Capture",
  "Graphics_DirectX",
  "Graphics_DirectX_Direct3D11",
  "Win32_Foundation",
  "Win32_Graphics_Direct3D",
  "Win32_Graphics_Direct3D11",
  "Win32_Graphics_Dxgi",
  "Win32_Graphics_Dxgi_Common",
  "Win32_Graphics_Dwm",
  "Win32_Graphics_Gdi",
  "Win32_System_Com",
  "Win32_System_Com_StructuredStorage",
  "Win32_System_LibraryLoader",
  "Win32_System_Ole",
  "Win32_System_Performance",
  "Win32_System_Threading",
  "Win32_System_Variant",
  "Win32_System_WinRT",
  "Win32_System_WinRT_Direct3D11",
  "Win32_System_WinRT_Graphics_Capture",
  "Win32_Security_Credentials",
  "Win32_UI_Accessibility",
  "Win32_UI_Shell",
  "Win32_UI_HiDpi",
  "Win32_UI_Input_KeyboardAndMouse",
  "Win32_UI_Shell_PropertiesSystem",
  "Win32_UI_WindowsAndMessaging",
] }
