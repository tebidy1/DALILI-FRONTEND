# بوابة الدمج — الأحمر يمنع. تعمل على كل push إلى main وكل PR.
name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  gate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: تثبيت الاعتمادات
        run: pnpm install --no-frozen-lockfile

      - name: فحص الأنواع
        run: pnpm -r --if-present typecheck

      - name: تشغيل الاختبارات
        run: pnpm -r --if-present test

      - name: بناء الويب
        run: pnpm --filter @dalili/web build

      - name: بناء الامتداد
        run: pnpm --filter @dalili/extension build
